<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="auth">
  <h1>Definir senha</h1>
  <p class="sub">Convite para <b>{{.Email}}</b>. Depois de salvar você poderá adicionar uma passkey.</p>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <form method="post" action="/invite/{{.Token}}">
    <label for="password">Senha (mínimo {{.PasswordMin}} caracteres)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{.PasswordMin}}" required>
    <label for="password_confirm">Repita a senha</label>
    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="{{.PasswordMin}}" required>
    <button class="primary" type="submit">Salvar senha e entrar</button>
  </form>
  <p class="muted">O link funciona uma única vez e expira em 48 horas.</p>
</div>
</body>
</html>
